[project]
name = "spond-mcp"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "spond>=1.2.1,<2.0.0",
    "mcp>=1.8.0,<2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
